保罗2FOR1；之后步行到《神探夏洛克》医院外景","lon":-0.099577,"lat":51.513705,"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cb/St_Pauls_aerial_%28cropped%29.jpg/960px-St_Pauls_aerial_%28cropped%29.jpg","source":"https://en.wikipedia.org/wiki/St_Paul%27s_Cathedral","status":"need"},{"time":"16:45","name":"千禧桥 → 泰特现代美术馆","sub":"《哈利·波特》取景地；过桥后参观免费常设展","lon":-0.0985,"lat":51.5108,"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Millenium_bridge_2015.jpg/960px-Millenium_bridge_2015.jpg","source":"https://en.wikipedia.org/wiki/Millennium_Bridge,_London","status":"free"}]},{"id":"d3","date":"10月6日 · 周二","title":"福尔摩斯、诺丁山与西区","color":"#446fd1","focus":"上午集中在贝克街，中午集中走诺丁山街区，15:00参观V&A；晚上的牛津街、摄政街、苏豪和唐人街合并成一条连续步行线。","stops":[{"time":"10:15","name":"福尔摩斯博物馆 → 贝克街站与雕像","sub":"10:15已预约；参观后步行拍摄车站与雕像","lon":-0.1586,"lat":51.5238,"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/221B_Baker_Street%2C_London_-_Sherlock_Holmes_Museum.jpg/960px-221B_Baker_Street%2C_London_-_Sherlock_Holmes_Museum.jpg","source":"https://en.wikipedia.org/wiki/Sherlock_Holmes_Museum","status":"booked"},{"time":"12:15","name":"诺丁山 → 波多贝罗路 → St Luke’s Mews","sub":"街区漫步；St Luke’s Mews视时间决定","lon":-0.205812,"lat":51.51712,"img":"https://upload.wikimedia.org/wikipedia/commons/0/04/London_110.jpg","source":"https://en.wikipedia.org/wiki/Notting_Hill","status":"optional"},{"time":"15:00","name":"V&A博物馆","sub":"常设展免费","lon":-0.172147,"lat":51.496595,"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Exterior_of_the_Victoria_and_Albert_Museum_-_2026.jpg/960px-Exterior_of_the_Victoria_and_Albert_Museum_-_2026.jpg","source":"https://en.wikipedia.org/wiki/Victoria_and_Albert_Museum","status":"free"},{"time":"18:00","name":"牛津街 → 摄政街 → 苏豪 → 唐人街","sub":"18:00开始逛街，晚餐放在苏豪或唐人街","lon":-0.141733,"lat":51.515179,"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Regent_Street_2011-04-25.jpg/960px-Regent_Street_2011-04-25.jpg","source":"https://en.wikipedia.org/wiki/Regent_Street"}]},{"id":"d4","date":"10月7日 · 周三","title":"格林尼治与金融城","color":"#139a8b","focus":"格林尼治合并成两组步行区域；下午的Sky Garden和Leadenhall Market距离很近，作为同一站游览。","stops":[{"time":"09:15","name":"Ranger’s House → 皇家天文台","sub":"09:15《布里奇顿》外景；随后步行上山，10:00天文台","lon":-0.001611,"lat":51.473455,"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/EH1218679_The_Ranger%27s_House.JPG/960px-EH1218679_The_Ranger%27s_House.JPG","source":"https://en.wikipedia.org/wiki/Ranger%27s_House","status":"need"},{"time":"12:00","name":"Queen’s House → 皇家海军学院","sub":"12:00开始；两处相邻，连同河岸一起游览","lon":-0.00373,"lat":51.481149,"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/Queens_House.jpg/960px-Queens_House.jpg","source":"https://en.wikipedia.org/wiki/Queen%27s_House","status":"free"},{"time":"15:00","name":"Sky Garden → Leadenhall Market","sub":"15:00已预约Sky Garden；之后步行至《哈利·波特》取景地","lon":-0.083555,"lat":51.511169,"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/Walkie-Talkie_-_Sept_2015_%28cropped%29.jpg/960px-Walkie-Talkie_-_Sept_2015_%28cropped%29.jpg","source":"https://en.wikipedia.org/wiki/20_Fenchurch_Street","status":"booked"}]}];

      {date:'10/4 · 16:30',name:'国家美术馆',status:'done',label:'已预约',copy:'2人普通入场',price:'免费'},

    legend.innerHTML=days.map(d=>`<span><i class="dot" style="background:${d.color}"></i>${d.date.slice(0,4)}</span>`).join('');
    const svg=document.querySelector('#map'),panel=document.querySelector('#dayPanel'),focus=document.querySelector('#focusCopy'),pop=document.querySelector('#stopPop');let selected='all';
    const W=900,H=610,pad=55;const all=days.flatMap(d=>d.stops);const minLon=Math.min(...all.map(x=>x.lon)),maxLon=Math.max(...all.map(x=>x.lon)),minLat=Math.min(...all.map(x=>x.lat)),maxLat=Math.max(...all.map(x=>x.lat));
    function xy(p){return [pad+(p.lon-minLon)/(maxLon-minLon)*(W-pad*2),H-pad-(p.lat-minLat)/(maxLat-minLat)*(H-pad*2)]}
    function renderMap(){svg.setAttribute('viewBox',`0 0 ${W} ${H}`);let out=`<path class="river" d="M 35 430 C 210 380, 315 425, 440 396 S 680 350, 870 385"/><ellipse class="zone" cx="455" cy="290" rx="395" ry="235"/><text class="zone-label" x="68" y="82">GREATER LONDON</text>`;
      days.forEach(d=>{const pts=d.stops.map(xy);out+=`<polyline class="route ${selected==='all'||selected===d.id?'':'dim'}" style="stroke:${d.color}" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;d.stops.forEach((s,i)=>{const [x,y]=pts[i],show=selected===d.id;out+=`<g class="marker ${selected==='all'||selected===d.id?'':'dim'}" data-day="${d.id}" data-i="${i}" transform="translate(${x},${y})"><circle r="11" fill="${d.color}"/><text>${i+1}</text>${show?`<text class="map-label" x="${i%2?16:-16}" y="${i%3===0?22:-14}" text-anchor="${i%2?'start':'end'}">${s.time} ${s.name}</text>`:''}</g>`})});svg.innerHTML=out;svg.querySelectorAll('.marker').forEach(m=>m.addEventListener('click',()=>showStop(m.dataset.day,+m.dataset.i)))}
    function tag(s){if(s.status==='booked')return '<span class="tag booked">已预约</span>';if(s.status==='need')return '<span class="tag need">需预约</span>';if(s.status==='free')return '<span class="tag free">免费</span>';if(s.status==='optional')return '<span class="tag optional">可选</span>';return ''}
    function renderPanel(){if(selected==='all'){panel.innerHTML=`<div class="panel-title"><h2>四天概览</h2><span class="date-pill">点击日期展开</span></div><h3 class="day-name">从经典伦敦到影视取景地</h3><div class="timeline">${days.map((d,i)=>`<div class="stop-row"><div class="time">${d.date.slice(0,4)}</div><div class="rail"><i class="pin" style="background:${d.color}"></i></div><div class="stop-copy"><strong>${d.title}</strong><span>${d.stops.length}组 · ${d.stops[0].time}开始</span></div></div>`).join('')}</div>`;focus.innerHTML='<p style="margin:0;color:var(--muted)">福尔摩斯博物馆已预约。下一项处理皇家天文台；10月5日的伦敦塔、圣保罗需要准备 National Rail 2FOR1材料。</p>';return}const d=days.find(x=>x.id===selected);panel.innerHTML=`<div class="panel-title"><h2>${d.date}</h2><span class="date-pill">${d.stops.length}组</span></div><h3 class="day-name">${d.title}</h3><div class="timeline">${d.stops.map((s,i)=>`<div class="stop-row"><div class="time">${s.time}</div><div class="rail"><i class="pin" style="background:${d.color}"></i></div><div class="stop-copy"><div class="stop-card"><img class="stop-thumb" src="${s.img}" alt="${s.name}" loading="lazy"><div class="stop-meta"><strong>${s.name}</strong><span>${s.sub}</span>${tag(s)}<a class="stop-source" href="${s.source}" target="_blank" rel="noopener">图片：Wikimedia Commons</a></div></div></div></div>`).join('')}</div>`;focus.innerHTML=`<p style="margin:0;color:var(--muted)">${d.focus}</p>`}
    function showStop(id,i){const d=days.find(x=>x.id===id),s=d.stops[i],img=pop.querySelector('.pop-img'),src=pop.querySelector('.pop-source');pop.querySelector('small').textContent=`${d.date} · 第${i+1}站`;img.src=s.img;img.alt=s.name;pop.querySelector('strong').textContent=`${s.time}　${s.name}`;pop.querySelector('div').textContent=s.sub;src.href=s.source;pop.classList.add('show')}
    pop.querySelector('button').onclick=()=>pop.classList.remove('show');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{selected=b.dataset.day;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));pop.classList.remove('show');renderMap();renderPanel()});renderMap();renderPanel();
  </script>
</body>
</html>
