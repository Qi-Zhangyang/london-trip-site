      {date:'10/7 · 19:30',name:'《歌剧魅影》',status:'done',label:'已订票',copy:'His Majesty’s Theatre · Royal Circle C3–C4',price:'2人含税总价以订单为准'}
    ];
    bookings.unshift(
      {date:'9/26—27',name:'OX Hotel Spean Bridge',status:'done',label:'已预订',copy:'连续2晚 · 已电话确认深夜入住',price:'含税价格以酒店订单为准'},
      {date:'9/26',name:'伦敦 → 格拉斯哥航班',status:'done',label:'已安排',copy:'衔接国际航班；落地后取车前往Spean Bridge',price:'以电子机票为准'},
      {date:'9/29 · 上午',name:'爱丁堡城堡',status:'done',label:'已安排',copy:'按电子票入场时段提前到达',price:'约 ¥213/人，以订单为准'},
      {date:'10/1 · 上午',name:'Chatsworth House',status:'done',label:'已预约',copy:'2人 · 按电子票时段入场',price:'含税价格以订单为准'},
      {date:'10/2 · 上午',name:'Christ Church',status:'todo',label:'尚未开售',copy:'10月2日票预计9月25日英国时间10:00开放；Great Hall当天仅门口观看',price:'预计约 ¥208/人'},
      {date:'10/2 · 10:45',name:'博德利图书馆／神学院',status:'done',label:'已预约',copy:'2人 · 按电子票时段入场',price:'含税价格以订单为准'},
      {date:'10/2 · 下午',name:'Warner Bros. Studio Tour',status:'done',label:'已订票',copy:'2人 · 按电子票入场时段到达',price:'含税价格以订单为准'},

    );
    bookings.push({date:'10/8 · 11:35',name:'伦敦 → 上海 → 香港',status:'done',label:'已出票',copy:'盖特维克北航站楼出发 · 上海中转3小时 · 行李直达香港',price:'以国际机票订单为准'});
    const bookingCard=b=>`<article class="booking"><div class="booking-top"><span class="booking-date">${b.date}</span><span class="status ${b.status}">${b.label}</span></div><strong>${b.name}</strong><p>${b.copy}</p><p class="price">${b.price}</p></article>`;
    const isRoadBooking=b=>/^9\//.test(b.date)||/^10\/[1-3]\b/.test(b.date);
    document.querySelector('#roadBookingGrid').innerHTML=bookings.filter(isRoadBooking).map(bookingCard).join('');
    document.querySelector('#londonBookingGrid').innerHTML=bookings.filter(b=>!isRoadBooking(b)).map(bookingCard).join('');
    const legend=document.querySelector('.legend');
    legend.innerHTML=days.map(d=>`<span><i class="dot" style="background:${d.color}"></i>${d.date.split(' ')[0]}</span>`).join('')+`<span><i class="dot" style="background:var(--show)"></i>已订演出</span>`;
    const svg=document.querySelector('#map'),panel=document.querySelector('#dayPanel'),focus=document.querySelector('#focusCopy'),pop=document.querySelector('#stopPop');let selected='all';
    const W=900,H=610,pad=55;const all=[...days.flatMap(d=>d.stops),...shows];const minLon=Math.min(...all.map(x=>x.lon)),maxLon=Math.max(...all.map(x=>x.lon)),minLat=Math.min(...all.map(x=>x.lat)),maxLat=Math.max(...all.map(x=>x.lat));
    function xy(p){return [pad+(p.lon-minLon)/(maxLon-minLon)*(W-pad*2),H-pad-(p.lat-minLat)/(maxLat-minLat)*(H-pad*2)]}
    function renderMap(){svg.setAttribute('viewBox',`0 0 ${W} ${H}`);let out=`<ellipse class="zone" cx="455" cy="305" rx="400" ry="245"/><text class="zone-label" x="68" y="82">UNITED KINGDOM · ROUTE OVERVIEW</text>`;
      days.forEach(d=>{const pts=d.stops.map(xy);out+=`<polyline class="route ${selected==='all'||selected===d.id?'':'dim'}" style="stroke:${d.color}" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;d.stops.forEach((s,i)=>{const [x,y]=pts[i],show=selected===d.id;out+=`<g class="marker ${selected==='all'||selected===d.id?'':'dim'}" data-day="${d.id}" data-i="${i}" transform="translate(${x},${y})"><circle r="11" fill="${d.color}"/><text>${i+1}</text>${show?`<text class="map-label" x="${i%2?16:-16}" y="${i%3===0?22:-14}" text-anchor="${i%2?'start':'end'}">${s.time} ${s.name}</text>`:''}</g>`})});shows.forEach((s,i)=>{const [x,y]=xy(s),visible=selected==='shows';out+=`<g class="marker ${visible?'':'dim'}" data-day="shows" data-i="${i}" transform="translate(${x},${y})"><circle r="13" fill="var(--show)"/><text>${String.fromCharCode(65+i)}</text>${visible?`<text class="map-label" x="${i===0?-18:18}" y="${i===1?-18:24}" text-anchor="${i===0?'end':'start'}">${s.time} ${s.name}</text>`:''}</g>`});svg.innerHTML=out;svg.querySelectorAll('.marker').forEach(m=>m.addEventListener('click',()=>showStop(m.dataset.day,+m.dataset.i)))}
    function coverSvg(name){const safe=String(name||'United Kingdom').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173f5f"/><stop offset=".52" stop-color="#2f8f83"/><stop offset="1" stop-color="#e0a458"/></linearGradient></defs><rect width="800" height="520" fill="url(#g)"/><path d="M0 405L165 238l115 110 130-190 105 145 110-92 175 194v115H0z" fill="#fff" opacity=".2"/><circle cx="655" cy="100" r="54" fill="#f7d774" opacity=".88"/><text x="48" y="450" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="white">${safe}</text></svg>`)}
    function imageTag(cls,s){return `<img class="${cls}" src="${s.img||coverSvg(s.name)}" alt="${s.name}" loading="lazy" onerror="this.onerror=null;this.src=coverSvg(this.alt)">`}
    function tag(s){if(s.status==='booked')return '<span class="tag booked">已预约</span>';if(s.status==='walkin')return '<span class="tag need">现场购票</span>';if(s.status==='need')return '<span class="tag need">待预约</span>';if(s.status==='check')return '<span class="tag check">核对出票</span>';if(s.status==='free')return '<span class="tag free">无需预约</span>';if(s.status==='optional')return '<span class="tag optional">可选</span>';return ''}
    function renderPanel(){if(selected==='all'){panel.innerHTML=`<div class="panel-title"><h2>全程概览</h2><span class="date-pill">点击日期展开</span></div><h3 class="day-name">英国南北纵贯行程</h3><div class="timeline">${days.map((d,i)=>`<div class="stop-row"><div class="time">${d.date.split(' ')[0]}</div><div class="rail"><i class="pin" style="background:${d.color}"></i></div><div class="stop-copy"><strong>${d.title}</strong><span>${d.stops.length}组 · ${d.stops[0].time}开始</span></div></div>`).join('')}</div>`;focus.innerHTML='<p style="margin:0;color:var(--muted)"><strong>除Christ Church外，其余预约均已完成。</strong>Christ Church的10月2日门票预计9月25日开放；伦敦塔按计划当天使用2FOR1现场购票。自然景点和城市步行路线无需预约。</p>';return}if(selected==='shows'){panel.innerHTML=`<div class="panel-title"><h2>已订演出</h2><span class="date-pill">2部</span></div><h3 class="day-name">西区演出安排</h3><div class="show-list">${shows.map((s,i)=>`<article class="show-option recommended">${imageTag('show-img',s)}<div class="show-option-head"><strong>${String.fromCharCode(65+i)} · ${s.name}</strong><span class="tag booked">已订票</span></div><p>${s.venue}</p><p><strong>场次：</strong>${s.schedule}</p><p>${s.sub}</p><a href="${s.source}" target="_blank" rel="noopener">查看演出官网</a></article>`).join('')}</div>`;focus.innerHTML='<p style="margin:0;color:var(--muted)"><strong>两场都已订好：</strong>10月6日19:00《怪奇物语》，10月7日19:30《歌剧魅影》。两天都建议至少提前30分钟到剧院。</p>';return}const d=days.find(x=>x.id===selected);panel.innerHTML=`<div class="panel-title"><h2>${d.date}</h2><span class="date-pill">${d.stops.length}组</span></div><h3 class="day-name">${d.title}</h3><div class="timeline">${d.stops.map((s,i)=>`<div class="stop-row"><div class="time">${s.time}</div><div class="rail"><i class="pin" style="background:${d.color}"></i></div><div class="stop-copy"><div class="stop-card">${imageTag('stop-thumb',s)}<div class="stop-meta"><strong>${s.name}</strong><span>${s.sub}</span>${tag(s)}<a class="stop-source" href="${s.source}" target="_blank" rel="noopener">图片：Wikimedia Commons</a></div></div></div></div>`).join('')}</div>`;focus.innerHTML=`<p style="margin:0;color:var(--muted)">${d.focus}</p>`}
    function showStop(id,i){const isShow=id==='shows',d=isShow?null:days.find(x=>x.id===id),s=isShow?shows[i]:d.stops[i],img=pop.querySelector('.pop-img'),src=pop.querySelector('.pop-source');pop.querySelector('small').textContent=isShow?'10月4日—7日 · 演出场次':`${d.date} · 第${i+1}站`;img.style.display=isShow?'none':'block';if(!isShow){img.alt=s.name;img.onerror=()=>{img.onerror=null;img.src=coverSvg(s.name)};img.src=s.img||coverSvg(s.name)}pop.querySelector('strong').textContent=`${s.time}　${s.name}`;pop.querySelector('div').textContent=isShow?`${s.venue}；${s.schedule}；${s.sub}`:s.sub;src.textContent=isShow?'官方票务':'查看地点资料';src.href=s.source;pop.classList.add('show')}
    const showStopBase=showStop;
    showStop=(id,i)=>{showStopBase(id,i);if(id==='shows'){const s=shows[i],img=pop.querySelector('.pop-img');img.style.display='block';img.alt=s.name;img.onerror=()=>{img.onerror=null;img.src=coverSvg(s.name)};img.src=s.img||coverSvg(s.name)}};
    pop.querySelector('button').onclick=()=>pop.classList.remove('show');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{selected=b.dataset.day;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));pop.classList.remove('show');renderMap();renderPanel()});renderMap();renderPanel();
  </script>
